<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8552F">
<meta name="description" content="妈妈的菜谱 · 家庭点餐与菜谱系统">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="妈妈的菜谱">
<title>妈妈的菜谱</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23E8552F'/%3E%3Cpath d='M9 19c0-3.9 3.1-7 7-7s7 3.1 7 7' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M8 21.5h16' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">

  <!-- 视图层：所有页面共存于同一文档流，切换时保留 DOM 与滚动位置 -->
  <main class="stage" id="stage">
    <section class="view" id="view-home"     data-view="home"></section>
    <section class="view" id="view-order"    data-view="order"></section>
    <section class="view" id="view-search"   data-view="search"></section>
    <section class="view" id="view-checkout" data-view="checkout"></section>
    <section class="view" id="view-recipes"  data-view="recipes"></section>
    <section class="view" id="view-recipe"   data-view="recipe"></section>
    <!-- 导入 / 导出不是独立页面，是菜谱页里的两个页签，所以这里没有对应节点 -->
  </main>

  <!-- 右下角固定购物袋 -->
  <button class="fab-bag" id="fabBag" type="button" aria-label="查看已选菜品" hidden>
    <span class="fab-bag-icon" data-icon="bag"></span>
    <span class="fab-badge" id="fabBadge" hidden>0</span>
  </button>

  <!-- 浮层：弹窗、底部抽屉、飞点、提示 -->
  <div class="layer" id="layer"></div>
  <div class="toast-host" id="toastHost"></div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/view-home.js"></script>
<script src="js/view-order.js"></script>
<script src="js/view-recipes.js"></script>
<script src="js/view-io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
